name: Update latest note feed

on:
  schedule:
    - cron: '0 21 * * *'  # 毎朝6時(JST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest 3 note articles
        run: python3 fetch_latest.py

      - name: Commit if changed
        run: |
          git config user.name "note-latest-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest3.json
          git diff --cached --quiet || git commit -m "Update latest3.json"
          git push

      - name: Purge jsDelivr cache
        run: curl -s "https://purge.jsdelivr.net/gh/339planning/note-latest-feed@main/latest3.json"
